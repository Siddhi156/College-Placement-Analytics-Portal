<!DOCTYPE html>
<html>
<head>
    <title>Placement Analysis</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>
    body {
        font-family: 'Segoe UI';
        background: #f5f7fb;
        padding: 20px;
        transition: 0.3s;
    }

    body.dark {
        background: #0f172a;
        color: #e2e8f0;
    }

    h1 {
        text-align: center;
        color: #5b21b6;
    }

    /* 🌙 DARK BUTTON */
    #darkToggle {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #111827;
        color: white;
        padding: 8px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 12px;
        z-index: 1000;
    }

    body.dark #darkToggle {
        background: #e2e8f0;
        color: #111;
    }

    /* CARDS */
    .cards {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 14px;
        width: 220px;
        text-align: center;
        box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    body.dark .card {
        background: #1e293b;
    }

    /* TABLE */
    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-bottom: 40px;
        border-radius: 10px;
        overflow: hidden;
    }

    body.dark table {
        background: #1e293b;
    }

    th {
        background: #7c3aed;
        color: white;
    }

    table, th, td {
        border: 1px solid #eee;
        padding: 10px;
    }

    /* CHARTS */
    .charts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 30px;
    }

    .chart-box {
        background: white;
        padding: 20px;
        border-radius: 14px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    body.dark .chart-box {
        background: #1e293b;
    }

    button {
        padding: 8px 16px;
        border: none;
        background: #7c3aed;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 10px;
    }

    /* 💬 CHAT BUTTON */
    #chatBtn {
        position: fixed;
        bottom: 25px;
        right: 25px;
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        color: white;
        padding: 16px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* 💬 CHAT BOX */
    #chatBox {
        position: fixed;
        bottom: 90px;
        right: 25px;
        width: 340px;
        height: 460px;
        backdrop-filter: blur(15px);
        background: rgba(255,255,255,0.9);
        border-radius: 20px;
        display: none;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    body.dark #chatBox {
        background: rgba(30,41,59,0.95);
    }

    #chatHeader {
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        color: white;
        padding: 14px;
        display: flex;
        justify-content: space-between;
    }

    #chatMessages {
        flex: 1;
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .msg {
        padding: 10px 14px;
        border-radius: 16px;
        max-width: 75%;
        font-size: 14px;
    }

    .user {
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        color: white;
        align-self: flex-end;
    }

    .bot {
        background: #f1f5f9;
        align-self: flex-start;
    }

    body.dark .bot {
        background: #334155;
    }

    #chatInputArea {
        display: flex;
        border-top: 1px solid #ddd;
    }

    #chatInputArea input {
        flex: 1;
        padding: 12px;
        border: none;
        outline: none;
        background: transparent;
        color: inherit;
    }

    #chatInputArea button {
        background: #7c3aed;
        color: white;
        border: none;
        padding: 0 16px;
        cursor: pointer;
    }

    </style>
</head>

<body>

<div id="darkToggle" onclick="toggleDark()">🌙 Dark</div>

<h1>📊 Placement Dashboard</h1>

{% if charts_exist %}

<div class="cards">
    <div class="card"><h2>Total</h2><p>{{ total }}</p></div>
    <div class="card"><h2>Placed</h2><p>{{ placed }}</p></div>
    <div class="card"><h2>Avg Salary</h2><p>{{ avg }} LPA</p></div>
</div>

<button onclick="showAll()">All</button>
<button onclick="showPlaced()">Placed</button>

<div id="allTable">{{ table_all|safe }}</div>
<div id="placedTable" style="display:none;">{{ table_placed|safe }}</div>

<div class="charts">
    <div class="chart-box"><div id="branchChart"></div></div>
    <div class="chart-box"><div id="pieChart"></div></div>
    <div class="chart-box"><div id="salaryChart"></div></div>
    <div class="chart-box"><div id="cgpaChart"></div></div>
</div>

<script id="data" type="application/json">
{
    "branch_group": {{ branch_group | tojson }},
    "placement": {{ placement_data | tojson }},
    "salary": {{ salary_data | tojson }},
    "cgpa_salary": {{ cgpa_salary_data | tojson }}
}
</script>

<script>
const data = JSON.parse(document.getElementById('data').textContent);

Plotly.newPlot('branchChart', [
    { x: data.branch_group.branches, y: data.branch_group.yes, type: 'bar' },
    { x: data.branch_group.branches, y: data.branch_group.no, type: 'bar' }
], { barmode: 'group' });

Plotly.newPlot('pieChart', [{
    labels: Object.keys(data.placement),
    values: Object.values(data.placement),
    type: 'pie'
}]);

Plotly.newPlot('salaryChart', [{ x: data.salary, type: 'histogram' }]);

Plotly.newPlot('cgpaChart', [{
    x: data.cgpa_salary.map(d => d.CGPA),
    y: data.cgpa_salary.map(d => d.Salary),
    mode: 'markers'
}]);

function showAll(){
    allTable.style.display="block";
    placedTable.style.display="none";
}

function showPlaced(){
    allTable.style.display="none";
    placedTable.style.display="block";
}

/* DARK MODE */
function toggleDark(){
    document.body.classList.toggle("dark");
    localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}

if(localStorage.getItem("darkMode")==="true"){
    document.body.classList.add("dark");
}

/* CHAT */
function toggleChat(){
    const box = document.getElementById("chatBox");
    box.style.display = box.style.display==="flex"?"none":"flex";
}

function sendMessage(){
    const input = document.getElementById("userInput");
    const chat = document.getElementById("chatMessages");

    const msg = input.value.trim();
    if(!msg) return;

    chat.innerHTML += `<div class="msg user">${msg}</div>`;

    const typing = document.createElement("div");
    typing.className = "msg bot";
    typing.innerHTML = "Typing...";
    chat.appendChild(typing);

    fetch('/chatbot',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:msg})
    })
    .then(res=>res.json())
    .then(data=>{
        typing.remove();
        chat.innerHTML += `<div class="msg bot">${data.response}</div>`;
        chat.scrollTop = chat.scrollHeight;
    });

    input.value="";
}

document.addEventListener("keypress", function(e){
    if(e.key==="Enter") sendMessage();
});
</script>

{% endif %}

<div id="chatBtn" onclick="toggleChat()">💬</div>

<div id="chatBox">
    <div id="chatHeader">
        🤖 Smart Assistant
        <span onclick="toggleChat()">✖</span>
    </div>

    <div id="chatMessages"></div>

    <div id="chatInputArea">
        <input id="userInput" placeholder="Ask something...">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

</body>
</html>
