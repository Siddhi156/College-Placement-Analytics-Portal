<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Dataset | Placement Analytics Portal</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #333;
            transition: 0.3s;
        }

        body.dark {
            background: #0f172a;
            color: #e2e8f0;
        }

        /* NAVBAR */
        .navbar {
            background: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        body.dark .navbar {
            background: #1e293b;
        }

        .navbar h2 {
            color: #764ba2;
        }

        body.dark .navbar h2 {
            color: #a78bfa;
        }

        .nav-links a {
            margin-left: 25px;
            text-decoration: none;
            color: #555;
            font-weight: 600;
        }

        body.dark .nav-links a {
            color: #cbd5e1;
        }

        .nav-links a:hover {
            color: #764ba2;
        }

        /* DARK BUTTON */
        #darkToggle {
            position: fixed;
            top: 36px;
            right: 320px;
            background: #111827;
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            z-index: 1000;
        }

        body.dark #darkToggle {
            background: #e2e8f0;
            color: #111;
        }

        /* UPLOAD BOX */
        .upload-container {
            max-width: 500px;
            margin: 80px auto;
            padding: 40px;
            border-radius: 20px;
            text-align: center;

            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);

            transition: 0.3s;
        }

        body.dark .upload-container {
            background: rgba(30,41,59,0.85);
        }

        .upload-container h1 {
            color: #764ba2;
        }

        body.dark .upload-container h1 {
            color: #a78bfa;
        }

        input[type="file"] {
            padding: 14px;
            border: 2px dashed #764ba2;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
            background: transparent;
            color: inherit;
        }

        /* BUTTON */
        .upload-btn {
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .upload-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .message {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<!-- 🌙 DARK MODE -->
<div id="darkToggle" onclick="toggleDark()">🌙 Dark</div>

<div class="navbar">
    <h2>📊 Placement Analytics</h2>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/dataset">Upload Dataset</a>
    </div>
</div>

<form action="/upload" method="post" enctype="multipart/form-data" onsubmit="return validateFile()">

<div class="upload-container">
    <h1>Upload Placement Dataset</h1>

    <p>
        Upload your dataset for smart analysis.<br>
        Supported: Excel (.xlsx, .xls) and CSV (.csv)
    </p>

    <input type="file" id="fileInput" name="dataset" accept=".xlsx,.xls,.csv" required>

    <button type="submit" class="upload-btn">Upload File</button>

    <div class="message" id="message"></div>
</div>

</form>

<script>
/* DARK MODE GLOBAL */
function toggleDark(){
    document.body.classList.toggle("dark");
    localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}

if(localStorage.getItem("darkMode")==="true"){
    document.body.classList.add("dark");
}

/* FILE VALIDATION */
function validateFile() {
    const fileInput = document.getElementById("fileInput");
    const message = document.getElementById("message");

    if (fileInput.files.length === 0) {
        message.style.color = "red";
        message.textContent = "Please select a file.";
        return false;
    }

    const fileName = fileInput.files[0].name;
    const allowed = /(\.xlsx|\.xls|\.csv)$/i;

    if (!allowed.exec(fileName)) {
        message.style.color = "red";
        message.textContent = "Only Excel or CSV allowed.";
        fileInput.value = "";
        return false;
    }

    message.style.color = "green";
    message.textContent = "Uploading...";
    return true;
}
</script>

</body>
</html>
