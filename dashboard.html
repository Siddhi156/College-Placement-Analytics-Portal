<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Placement Dashboard</title>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            transition: 0.3s;
        }

        body.dark {
            background: #0f172a;
            color: #e2e8f0;
        }

        h1 {
            background: linear-gradient(120deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            margin: 0;
        }

        /* 🌙 PERFECT BUTTON */
        #darkToggle {
            position: fixed;
            top: 36px;
            right: 320px;
            background: #111827;
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            z-index: 1000;
        }

        body.dark #darkToggle {
            background: #e2e8f0;
            color: #111;
        }

        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 30px;
            padding: 40px;
        }

        .chart-box {
            padding: 20px;
            border-radius: 18px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        body.dark .chart-box {
            background: rgba(30,41,59,0.85);
        }

        .chart-box:hover {
            transform: translateY(-5px);
        }

        h3 {
            margin-bottom: 10px;
            color: #6d28d9;
        }

        body.dark h3 {
            color: #a78bfa;
        }

        .message {
            margin-top: 80px;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<!-- 🌙 DARK MODE -->
<div id="darkToggle" onclick="toggleDark()">🌙 Dark</div>

<h1>📊 Placement Analytics Dashboard</h1>

{% if charts_exist %}

<div class="charts">

    <div class="chart-box">
        <h3>Branch-wise Placement</h3>
        <div id="branchChart"></div>
    </div>

    <div class="chart-box">
        <h3>Placement Ratio</h3>
        <div id="pieChart"></div>
    </div>

    <div class="chart-box">
        <h3>Salary Distribution</h3>
        <div id="salaryChart"></div>
    </div>

    <div class="chart-box">
        <h3>CGPA vs Salary</h3>
        <div id="cgpaChart"></div>
    </div>

</div>

<!-- ✅ SAFE DATA PASS -->
<script id="chartData" type="application/json">
{
    "branch_group": {{ branch_group | tojson }},
    "placement": {{ placement_data | tojson }},
    "salary": {{ salary_data | tojson }},
    "cgpa_salary": {{ cgpa_salary_data | tojson }}
}
</script>

<script>
const data = JSON.parse(document.getElementById("chartData").textContent);

// BAR (FIXED)
Plotly.newPlot('branchChart', [
    {
        x: data.branch_group.branches,
        y: data.branch_group.yes,
        type: 'bar',
        name: 'Placed'
    },
    {
        x: data.branch_group.branches,
        y: data.branch_group.no,
        type: 'bar',
        name: 'Not Placed'
    }
], { barmode: 'group' });

// PIE
Plotly.newPlot('pieChart', [{
    labels: Object.keys(data.placement),
    values: Object.values(data.placement),
    type: 'pie'
}]);

// HISTOGRAM
Plotly.newPlot('salaryChart', [{
    x: data.salary,
    type: 'histogram'
}]);

// SCATTER
Plotly.newPlot('cgpaChart', [{
    x: data.cgpa_salary.map(d => d.CGPA),
    y: data.cgpa_salary.map(d => d.Salary),
    mode: 'markers',
    type: 'scatter'
}], {
    xaxis: { title: "CGPA" },
    yaxis: { title: "Salary (LPA)" }
});
</script>

{% else %}

<div class="message">
    ⚠️ No dataset uploaded yet.<br><br>
    Please upload dataset first.
</div>

{% endif %}

<script>
function toggleDark(){
    document.body.classList.toggle("dark");
    localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}

if(localStorage.getItem("darkMode")==="true"){
    document.body.classList.add("dark");
}
</script>

</body>
</html>
